name: CI

# Two things are worth proving on every push. That the invariants still hold,
# and that the artifacts in the repo are the ones this code produces -- the
# second is what makes "regenerated by one command" checkable rather than
# claimed. Neither job touches the network: data/raw/ is committed alongside
# its MANIFEST, so a clean checkout has everything the pipeline needs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  MPLBACKEND: Agg

jobs:
  tests:
    name: invariant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  reproducibility:
    name: committed outputs match a clean rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Rebuild every table, figure and page from the raw data
        run: python -m ahi.pipeline
        env:
          PYTHONPATH: src

      - name: Compare the rebuild against what is checked in
        run: python -m ahi.regen_check
        env:
          PYTHONPATH: src

      # Useful on a failure: the rebuilt page and figures, to look at directly.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rebuilt-site
          path: docs/
          retention-days: 7
